<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101b2d">
    <meta http-equiv="refresh" content="0; url=otpadet.html#vehicleCatalog">
    <link rel="canonical" href="otpadet.html">
    <title>AutoParts Tetov — Gjej pjesë për veturën</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
            background: radial-gradient(ellipse at 80% 15%, #27497e 0, transparent 42%), #101b2d;
            color: #fff;
            font-family: "Segoe UI", Arial, sans-serif;
            text-align: center;
        }
        main { max-width: 560px; }
        .mark {
            display: grid;
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            place-items: center;
            border-radius: 17px;
            background: #2864e8;
            font-size: 26px;
        }
        h1 { margin: 0 0 12px; font-size: clamp(28px, 7vw, 42px); }
        p { margin: 0 0 24px; color: #c3cede; line-height: 1.65; }
        a {
            display: inline-block;
            padding: 13px 20px;
            border-radius: 10px;
            background: #2864e8;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        a:hover { background: #1d4ed8; }
    </style>
    <script>
        window.location.replace("otpadet.html#vehicleCatalog");
    </script>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">🔧</div>
        <h1>AutoParts Tetov</h1>
        <p>Po hapim katalogun sipas markës dhe modelit të veturës.</p>
        <a href="otpadet.html#vehicleCatalog">Hap katalogun</a>
    </main>
</body>
</html>
